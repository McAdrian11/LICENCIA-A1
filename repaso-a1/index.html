<!doctype html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="../tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>

  <style>
    body { font-family: "Inter", sans-serif; }
    .headline { font-family: "Plus Jakarta Sans", sans-serif; }
  </style>
</head>

<body class="bg-surface-container-lowest text-on-surface h-screen overflow-hidden">

<main class="flex flex-col h-full max-w-4xl mx-auto px-4 md:px-6 py-3 w-full">

  <!-- HEADER -->
  <header class="flex justify-between items-center py-3 shrink-0">
    <a href="../menu/index.html" class="text-primary">
      <span class="bg-gradient-to-r from-primary to-primary-container text-transparent bg-clip-text font-bold text-lg md:text-xl headline tracking-tight">
        LICENCIA A1
      </span>
    </a>
  </header>

  <!-- ================= SETUP ================= -->
  <div id="setup" class="flex-1 flex flex-col justify-center">

    <div class="text-center mb-6">
      <h1 class="headline text-2xl md:text-4xl font-extrabold mb-2">
        Práctica
      </h1>
      <p class="text-on-surface-variant text-xs md:text-base">
        ¿Cuántas preguntas quieres resolver? (1 - 200)
      </p>
    </div>

    <div class="bg-surface-container p-5 md:p-8 rounded-[2rem] shadow-xl">
      <input
        id="numQuestions"
        type="number"
        placeholder="Ej: 20"
        class="w-full text-center text-xl md:text-3xl p-3 md:p-5 rounded-xl bg-surface-container-highest outline-none mb-5"
      />

      <button
        onclick="startPractice()"
        class="w-full px-6 py-3 md:py-4 bg-gradient-to-r from-primary to-primary-container text-black font-bold rounded-full transition-all hover:scale-105"
      >
        Comenzar
      </button>
    </div>

  </div>

  <!-- ================= QUIZ ================= -->
  <div id="quiz" class="hidden flex-1 flex flex-col overflow-hidden">

    <div class="flex-1 flex flex-col overflow-hidden pt-1">

      <!-- PROGRESO -->
      <div class="mb-4 flex justify-between items-end shrink-0">

        <div>
          <span class="text-[9px] text-primary/80 uppercase tracking-[0.25em]">
            PREGUNTA
          </span>

          <div class="flex items-baseline gap-2">
            <span id="current" class="text-4xl md:text-5xl font-extrabold headline">01</span>
            <span class="text-lg md:text-2xl text-on-surface-variant/40 font-bold">
              / <span id="total">10</span>
            </span>
          </div>
        </div>

        <div class="w-40 md:w-60">
          <div class="flex justify-between mb-1">
            <span class="text-[10px] text-primary uppercase">Progreso</span>
            <span id="percent" class="text-[10px] text-on-surface-variant">0%</span>
          </div>

          <div class="h-1 bg-surface-container-highest rounded-full overflow-hidden">
            <div id="bar"
              class="h-full bg-gradient-to-r from-primary to-primary-container transition-all duration-500">
            </div>
          </div>
        </div>

      </div>

      <!-- CARD -->
      <div class="bg-surface-container p-4 md:p-6 rounded-[2rem] shadow-xl mb-3 space-y-3 shrink-0">

        <h2 id="question" class="text-base md:text-xl font-bold leading-tight"></h2>

        <!-- IMAGEN -->
        <div id="image-container" class="hidden w-full">
          <div class="bg-surface-container-highest p-2 md:p-3 rounded-2xl overflow-hidden w-full">
            <img id="image"
              class="w-full max-h-[120px] md:max-h-[180px] object-contain mx-auto"/>
          </div>
        </div>

      </div>

      <!-- OPCIONES (SCROLL SOLO AQUÍ) -->
      <div id="options" class="space-y-2 md:space-y-3 overflow-y-auto flex-1 pr-1 pb-6"></div>

    </div>

  </div>

</main>

<script src="../data/questions.js"></script>
<script src="app.js"></script>

</body>
</html>
